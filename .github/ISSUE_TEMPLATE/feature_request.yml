name: 機能要望
description: 新機能・改善の提案
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること・ユースケース
      description: どんな場面で何に困っているかを書いてください
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足
    validations:
      required: false
